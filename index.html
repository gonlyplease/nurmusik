<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nur Musik">
<meta name="theme-color" content="#F2F2F2">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Nur Musik</title>
<style>
  /* Vier Farben: Weiß, Grau, Schwarz, Blau (siehe design.md) */
  :root{
    --white:#FFFFFF; --grey1:#F2F2F2; --line:#E5E5E5; --grey2:#8E8E93; --black:#111111; --blue:#0A64D6;
    --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--white);color:var(--black);
    font:17px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input{font:inherit}
  svg{display:block}
  #root{height:100%}
  #app{display:flex;flex-direction:column;height:100%}

  /* Titelleiste: zurück links, Titel mittig */
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;flex:none;
    padding:calc(var(--sat) + 8px) 12px 8px;background:var(--grey1);border-bottom:1px solid var(--line);min-height:52px}
  header h1{grid-column:2;margin:0;font-size:17px;font-weight:600;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
  .back{grid-column:1;justify-self:start;color:var(--blue);font-size:17px;padding:8px 4px;min-height:44px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:28vw}

  main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .page{min-height:100%}
  @keyframes fromRight{from{transform:translateX(100%)}to{transform:none}}
  @keyframes fromLeft{from{transform:translateX(-100%)}to{transform:none}}
  .page.fwd{animation:fromRight .2s ease-out}
  .page.bwd{animation:fromLeft .2s ease-out}

  /* Listen */
  .row{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 16px;text-align:left;
    border-bottom:1px solid var(--line);color:var(--black);text-decoration:none}
  .row .t{flex:1;min-width:0}
  .row .t b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .t span{display:block;color:var(--grey2);font-size:14px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .chev{color:var(--grey2);font-size:22px;line-height:1;flex:none}
  .row .num{width:22px;color:var(--grey2);text-align:right;flex:none;font-size:14px}
  .row .dot{width:8px;height:8px;border-radius:4px;flex:none;background:transparent}
  .row.playing .t b{color:var(--blue)}
  .row.playing .dot{background:var(--blue)}
  .row:active,.row:active .t b,.row:active .t span,.row:active .chev,.row:active .num{background:var(--blue);color:var(--white)}
  .row:active .dot{background:var(--white)}
  .sect{padding:6px 16px;background:var(--grey1);color:var(--grey2);font-size:14px;border-bottom:1px solid var(--line)}
  .msg{color:var(--grey2);padding:24px 16px;text-align:center;font-size:15px}

  /* Kopf von Playlist/Album/Künstler */
  .head{padding:18px 16px 16px;border-bottom:1px solid var(--line)}
  .head h2{margin:0;font-size:20px;font-weight:600}
  .head p{margin:2px 0 0;color:var(--grey2);font-size:16px}
  .actions{display:flex;gap:10px;margin-top:14px}
  .btn{display:inline-block;min-height:44px;padding:11px 20px;border-radius:8px;font-size:16px;font-weight:600;
    background:var(--blue);color:var(--white);text-decoration:none;text-align:center}
  .btn.sec{background:var(--white);color:var(--black);border:1px solid var(--grey2);font-weight:400}
  .btn:active{opacity:.7}

  .search{padding:10px 16px;border-bottom:1px solid var(--line)}
  .search input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--grey1);color:var(--black);outline:none}
  .search input:focus{border-color:var(--blue)}

  /* Leiste unten: aktueller Song */
  #mini{display:none;position:relative;flex:none;background:var(--grey1);border-top:1px solid var(--line);
    padding:0 6px calc(var(--sab)) 6px}
  #mini.show{display:flex;align-items:center}
  #mini .bar{position:absolute;left:0;top:-1px;height:2px;background:var(--blue);width:0}
  #mini .t{flex:1;min-width:0;padding:14px 4px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
  #mini .t span{color:var(--grey2)}
  .ic{width:48px;height:48px;display:grid;place-items:center;color:var(--black);flex:none;border-radius:8px}
  .ic:active{background:var(--line)}
  .ic svg{width:22px;height:22px;fill:currentColor}

  /* Läuft */
  #full{position:fixed;inset:0;background:var(--white);z-index:10;display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .25s ease-out}
  #full.show{transform:none}
  #full .body{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 24px calc(var(--sab) + 16px)}
  #full .cover{flex:1;display:grid;place-items:center;min-height:0;padding:20px 0}
  #full .cover img{width:min(100%,320px);max-height:100%;aspect-ratio:1;object-fit:cover;background:var(--grey1);border:1px solid var(--line)}
  #full h2{margin:0;font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #full .sub{color:var(--grey2);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #full input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;margin:18px 0 6px;border-radius:2px;
    background:linear-gradient(to right,var(--blue) var(--p,0%),var(--line) var(--p,0%));outline:none}
  #full input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:8px;background:var(--blue);border:0}
  #full input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:8px;background:var(--blue);border:0}
  #full .times{display:flex;justify-content:space-between;color:var(--grey2);font-size:13px;font-variant-numeric:tabular-nums}
  #full .ctrls{display:flex;justify-content:center;align-items:center;gap:28px;margin:18px 0 14px}
  #full .ctrls .ic{width:64px;height:64px}
  #full .ctrls .ic svg{width:34px;height:34px}
  #full .ctrls .ic.big svg{width:44px;height:44px}
  #full .togs{display:flex;justify-content:space-between;border-top:1px solid var(--line)}
  #full .tog{padding:14px 0;font-size:15px;color:var(--grey2);min-height:48px}
  #full .tog.on{color:var(--blue)}
  #full .row{padding:8px 0;border-top:1px solid var(--line);border-bottom:0}

  /* Geräteauswahl */
  #sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none;align-items:flex-end}
  #sheet.show{display:flex}
  #sheet .box{background:var(--white);width:100%;border-radius:12px 12px 0 0;padding:8px 0 calc(var(--sab) + 12px);max-height:70%;overflow-y:auto}
  #sheet h3{margin:0;padding:12px 16px;font-size:17px;font-weight:600;text-align:center;border-bottom:1px solid var(--line)}
  #sheet .actions{justify-content:center;margin-bottom:12px}

  /* Meldungen */
  #toast{position:fixed;left:12px;right:12px;bottom:calc(var(--sab) + 64px);background:var(--black);color:var(--white);
    padding:12px 14px;border-radius:8px;z-index:30;display:none;font-size:15px}
  #toast.show{display:block}
  #toast a{color:var(--white);font-weight:600;text-decoration:underline}

  /* Einrichtung / Anmeldung */
  .setup{padding:calc(var(--sat) + 30px) 22px 30px;max-width:520px;margin:0 auto;overflow-y:auto;height:100%}
  .setup h1{font-size:24px;font-weight:600;margin:0 0 8px}
  .setup p,.setup li{color:var(--black);font-size:16px}
  .setup .err{border-left:3px solid var(--blue);padding-left:10px;font-weight:600}
  .setup .link{color:var(--grey2)}
  .setup ol{padding-left:20px}
  .setup li{margin-bottom:6px}
  .setup code{background:var(--grey1);padding:2px 6px;border-radius:4px;font-size:14px;word-break:break-all}
  .setup input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--grey1);color:var(--black);margin:8px 0 12px;outline:none}
  .setup input:focus{border-color:var(--blue)}

  @media (prefers-reduced-motion: reduce){
    .page.fwd,.page.bwd{animation:none}
    #full{transition:none}
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="sheet"><div class="box" id="sheetBox"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ============ Konfiguration ============ */
const SCOPES = [
  "user-read-playback-state","user-modify-playback-state","user-read-currently-playing",
  "playlist-read-private","playlist-read-collaborative","user-library-read","user-follow-read"
].join(" ");
const REDIRECT = location.origin + location.pathname;
const API = "https://api.spotify.com/v1";

/* ============ Hilfsfunktionen ============ */
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
function img(images, size){
  if (!images || !images.length) return null;
  const sorted = [...images].sort((a,b)=>(a.width||0)-(b.width||0));
  return (sorted.find(i => (i.width||640) >= size) || sorted[sorted.length-1]).url;
}
function fmt(ms){ ms = Math.max(0, ms|0); const s = Math.floor(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function artists(list){ return (list||[]).map(a=>a.name).join(", "); }
let toastTimer;
function toast(html, ms=3500){
  const t = $("#toast"); t.innerHTML = html; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), ms);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ============ Login (PKCE) ============ */
function b64url(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function login(){
  const arr = crypto.getRandomValues(new Uint8Array(48));
  const verifier = b64url(arr);
  LS.set("pkce_verifier", verifier);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const p = new URLSearchParams({
    response_type:"code", client_id:LS.get("client_id"), scope:SCOPES,
    redirect_uri:REDIRECT, code_challenge_method:"S256", code_challenge:challenge
  });
  location.href = "https://accounts.spotify.com/authorize?" + p;
}
function saveTokens(d){
  LS.set("access_token", d.access_token);
  if (d.refresh_token) LS.set("refresh_token", d.refresh_token);
  LS.set("expires_at", String(Date.now() + (d.expires_in||3600)*1000));
}
async function tokenRequest(params){
  const r = await fetch("https://accounts.spotify.com/api/token", {
    method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({client_id:LS.get("client_id"), ...params})
  });
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.error_description || d.error || ("Token-Fehler " + r.status));
  saveTokens(d);
}
let refreshing = null;
function refreshToken(){
  if (!refreshing) {
    refreshing = tokenRequest({grant_type:"refresh_token", refresh_token:LS.get("refresh_token")})
      .finally(()=>{ refreshing = null; });
  }
  return refreshing;
}
async function getToken(){
  if (Date.now() > Number(LS.get("expires_at")||0) - 60000) await refreshToken();
  return LS.get("access_token");
}
function logout(){
  ["access_token","refresh_token","expires_at","pkce_verifier","device","device_chosen"].forEach(k=>LS.del(k));
  location.replace(REDIRECT);
}

/* ============ API ============ */
async function api(path, opts={}){
  const {method="GET", body, query} = opts;
  const url = new URL(path.startsWith("http") ? path : API + path);
  if (query) for (const [k,v] of Object.entries(query)) if (v != null && v !== "") url.searchParams.set(k, v);
  for (let attempt = 0; attempt < 2; attempt++) {
    let token;
    try { token = await getToken(); }
    catch(e){ logout(); throw e; }
    const r = await fetch(url, {
      method,
      headers: Object.assign({Authorization:"Bearer " + token}, body ? {"Content-Type":"application/json"} : {}),
      body: body ? JSON.stringify(body) : undefined
    });
    if (r.status === 401 && attempt === 0) { await refreshToken().catch(()=>logout()); continue; }
    if (r.status === 204 || r.status === 202) return null;
    const text = await r.text();
    let data = null; try { data = text ? JSON.parse(text) : null; } catch(e){}
    if (!r.ok) {
      const err = new Error((data && data.error && data.error.message) || ("HTTP " + r.status));
      err.status = r.status; err.reason = data && data.error && data.error.reason;
      if (r.status === 429) toast("Spotify bremst gerade (zu viele Anfragen). Kurz warten.");
      throw err;
    }
    return data;
  }
}

/* ============ Wiedergabe ============ */
// Ziel ist das iPhone oder ein Gerät, das du selbst im Gerätemenü gewählt hast.
// Lautsprecher (z. B. Echo) werden nie automatisch genommen.
function isOkDevice(d){ return !!d && (d.type === "Smartphone" || d.id === LS.get("device_chosen")); }
async function targetDevice(){
  const ds = ((await api("/me/player/devices")) || {}).devices || [];
  return ds.find(d => d.id === LS.get("device_chosen")) || ds.find(d => d.type === "Smartphone") || null;
}
async function resolveDevice(){
  try { const d = await targetDevice(); if (!d) noDevice(); return d; }
  catch(e){ handleErr(e); return null; }
}
function noDevice(){
  toast('Kein Wiedergabegerät: Spotify läuft auf dem iPhone gerade nicht. <a href="spotify:">Spotify kurz öffnen</a>, dann hierher zurück und nochmal tippen. Andere Geräte wählst du über den Mini-Player.', 9000);
}
function playingOn(d){ if (!d.is_active) toast("Spielt auf: " + esc(d.name), 2500); }
async function play(body, d){
  d = d || await resolveDevice(); if (!d) return;
  try { await api("/me/player/play", {method:"PUT", body, query:{device_id:d.id}}); }
  catch(e){ return handleErr(e); }
  playingOn(d);
  setTimeout(pollPlayer, 500); setTimeout(pollPlayer, 1500);
}
function handleErr(e){
  if (e.status === 404 || e.reason === "NO_ACTIVE_DEVICE") return noDevice();
  if (e.status === 403) return toast("Das hat Spotify abgelehnt (Premium nötig oder Aktion gerade nicht möglich).");
  toast("Fehler: " + esc(e.message));
}
async function ctl(path, method="POST", query){
  try { await api(path, {method, query}); } catch(e){ return handleErr(e); }
  setTimeout(pollPlayer, 400); setTimeout(pollPlayer, 1200);
}
const playCtx = (uri, offsetUri) => play(offsetUri ? {context_uri:uri, offset:{uri:offsetUri}} : {context_uri:uri});
async function shufflePlay(uri){
  const d = await resolveDevice(); if (!d) return;
  const shuffleOn = () => api("/me/player/shuffle", {method:"PUT", query:{state:true, device_id:d.id}});
  const ok = await shuffleOn().then(()=>true, ()=>false);
  await play({context_uri:uri}, d);
  // Ein ruhendes Gerät nimmt Shuffle evtl. erst an, wenn es spielt.
  if (!ok) shuffleOn().catch(()=>{});
}
async function resume(){
  // Läuft die Wiedergabe auf einem nicht gewählten Lautsprecher, holen wir sie aufs iPhone.
  if (isOkDevice(state.device)) return ctl("/me/player/play", "PUT", {device_id: state.device.id});
  const d = await resolveDevice(); if (!d) return;
  try { await api("/me/player", {method:"PUT", body:{device_ids:[d.id], play:true}}); }
  catch(e){ return handleErr(e); }
  playingOn(d);
  setTimeout(pollPlayer, 800); setTimeout(pollPlayer, 1800);
}

/* ============ Symbole (einfache Formen statt Emojis) ============ */
const ICONS = {
  play:  '<path d="M7 4.5v15l12.5-7.5z"/>',
  pause: '<path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/>',
  prev:  '<path d="M5 5h2.5v14H5zM20 5v14L8.5 12z"/>',
  next:  '<path d="M16.5 5H19v14h-2.5zM4 5v14l11.5-7z"/>'
};
function svg(name){ return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>'; }
function icon(name, attrs){ const b = h("button", Object.assign({class:"ic"}, attrs)); b.innerHTML = svg(name); return b; }
function setIcon(el, name){ if (el.dataset.icon !== name) { el.innerHTML = svg(name); el.dataset.icon = name; } }

/* ============ Player-Status ============ */
let state = null, stateAt = 0, pollTimer = null, seeking = false;
async function pollPlayer(){
  try {
    state = await api("/me/player", {query:{additional_types:"episode"}});
    stateAt = Date.now();
  } catch(e){ /* still */ }
  renderPlayer();
}
function curPos(){
  if (!state) return 0;
  const p = state.progress_ms + (state.is_playing ? Date.now() - stateAt : 0);
  return Math.min(p, (state.item && state.item.duration_ms) || p);
}
const REPEAT_LABEL = {off:"Aus", context:"Alle", track:"Song"};
function renderPlayer(){
  const mini = $("#mini"); if (!mini) return;
  const it = state && state.item;
  const nowRow = $("#menuNow"); if (nowRow) nowRow.style.display = it ? "" : "none";
  if (!it) { mini.classList.remove("show"); return; }
  mini.classList.add("show");
  const sub = it.artists ? artists(it.artists) : (it.show ? it.show.name : "");
  const playName = state.is_playing ? "pause" : "play";
  $("#mT").textContent = it.name; $("#mS").textContent = sub ? " – " + sub : "";
  setIcon($("#mPlay"), playName);
  $("#fImg").src = img((it.album && it.album.images) || it.images, 600) || "";
  $("#fT").textContent = it.name; $("#fS").textContent = sub;
  $("#fA").textContent = (it.album && it.album.name) || "";
  setIcon($("#fPlay"), playName);
  $("#fShuf").classList.toggle("on", !!state.shuffle_state);
  $("#fShuf").textContent = "Zufall: " + (state.shuffle_state ? "An" : "Aus");
  const rep = state.repeat_state || "off";
  $("#fRep").classList.toggle("on", rep !== "off");
  $("#fRep").textContent = "Wiederholen: " + (REPEAT_LABEL[rep] || "Aus");
  $("#fDev").textContent = state.device ? state.device.name : "Gerät wählen";
  document.querySelectorAll(".row[data-uri]").forEach(r => r.classList.toggle("playing", r.dataset.uri === it.uri));
  tick();
}
function tick(){
  if (!state || !state.item) return;
  const dur = state.item.duration_ms || 1, pos = curPos();
  const shown = seeking ? Number($("#fRange").value) : pos;
  $("#mBar").style.width = (pos/dur*100) + "%";
  if (!seeking) { $("#fRange").max = dur; $("#fRange").value = pos; }
  $("#fRange").style.setProperty("--p", (shown/dur*100) + "%");
  $("#fCur").textContent = fmt(shown);
  $("#fDur").textContent = "-" + fmt(dur - shown);
}
const DEVICE_TYPE = {Smartphone:"Smartphone", Computer:"Computer", Speaker:"Lautsprecher", TV:"Fernseher", Tablet:"Tablet", CastAudio:"Lautsprecher", AVR:"Verstärker"};
async function devicePicker(){
  let ds = [];
  try { ds = ((await api("/me/player/devices")) || {}).devices || []; } catch(e){ return handleErr(e); }
  const box = $("#sheetBox"); box.innerHTML = "";
  box.append(h("h3", null, "Abspielen auf"));
  if (!ds.length) box.append(h("div", {class:"msg"}, "Keine Geräte gefunden. Öffne Spotify kurz auf dem iPhone (oder einem anderen Gerät) und versuche es erneut."),
    h("div", {class:"actions"}, h("a", {class:"btn", href:"spotify:"}, "Spotify öffnen")));
  for (const d of ds) {
    const r = h("button", {class:"row" + (d.is_active ? " playing" : ""), onclick: async () => {
      closeSheet(); LS.set("device_chosen", d.id);
      try { await api("/me/player", {method:"PUT", body:{device_ids:[d.id], play: !!(state && state.is_playing)}}); }
      catch(e){ return handleErr(e); }
      setTimeout(pollPlayer, 800);
    }}, h("span", {class:"dot"}),
      h("div", {class:"t"}, h("b", null, d.name), h("span", null, (DEVICE_TYPE[d.type] || d.type) + (d.is_active ? " · spielt gerade" : ""))));
    box.append(r);
  }
  $("#sheet").classList.add("show");
}
function closeSheet(){ $("#sheet").classList.remove("show"); }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
// Damit iOS den gedrückten Zustand (blau) anzeigt.
document.addEventListener("touchstart", () => {}, {passive:true});

/* ============ Ansichten ============ */
let me = null, stack = [];
async function loadMe(){ if (!me) me = await api("/me"); return me; }
function shell(){
  const root = $("#root"); root.innerHTML = "";
  root.append(h("div", {id:"app"},
    h("header", null,
      h("button", {class:"back", id:"back", style:"display:none", onclick: goBack}, "‹ Menü"),
      h("h1", {id:"title"}, "")),
    h("main", {id:"main"}),
    h("div", {id:"mini"},
      h("div", {class:"bar", id:"mBar"}),
      icon("play", {id:"mPlay", "aria-label":"Abspielen/Pause", onclick: togglePlay}),
      h("button", {class:"t", onclick: openFull}, h("b", {id:"mT", style:"font-weight:400"}), h("span", {id:"mS"})),
      icon("next", {"aria-label":"Nächster Song", onclick: () => ctl("/me/player/next")}))
  ));
  root.append(h("div", {id:"full"},
    h("header", null,
      h("button", {class:"back", onclick: closeFull}, "‹ Zurück"),
      h("h1", null, "Läuft")),
    h("div", {class:"body"},
      h("div", {class:"cover"}, h("img", {id:"fImg", alt:""})),
      h("h2", {id:"fT"}), h("div", {class:"sub", id:"fS"}), h("div", {class:"sub", id:"fA"}),
      h("input", {type:"range", id:"fRange", min:0, max:1, value:0, "aria-label":"Position",
        oninput: () => { seeking = true; tick(); },
        onchange: async e => { const v = e.target.value; await ctl("/me/player/seek", "PUT", {position_ms: v}); seeking = false; }}),
      h("div", {class:"times"}, h("span", {id:"fCur"}, "0:00"), h("span", {id:"fDur"}, "-0:00")),
      h("div", {class:"ctrls"},
        icon("prev", {"aria-label":"Vorheriger Song", onclick: () => ctl("/me/player/previous")}),
        icon("play", {id:"fPlay", class:"ic big", "aria-label":"Abspielen/Pause", onclick: togglePlay}),
        icon("next", {"aria-label":"Nächster Song", onclick: () => ctl("/me/player/next")})),
      h("div", {class:"togs"},
        h("button", {class:"tog", id:"fShuf", onclick: () => ctl("/me/player/shuffle", "PUT", {state: !(state && state.shuffle_state)})}, "Zufall: Aus"),
        h("button", {class:"tog", id:"fRep", onclick: () => {
          const order = ["off","context","track"]; const cur = (state && state.repeat_state) || "off";
          ctl("/me/player/repeat", "PUT", {state: order[(order.indexOf(cur)+1) % 3]});
        }}, "Wiederholen: Aus")),
      h("button", {class:"row", onclick: devicePicker},
        h("div", {class:"t"}, h("span", {style:"margin:0"}, "Spielt auf"), h("b", {id:"fDev"}, "Gerät wählen")),
        h("span", {class:"chev"}, "›")))
  ));
}
function openFull(){ $("#full").classList.add("show"); }
function closeFull(){ $("#full").classList.remove("show"); }
function togglePlay(){
  if (state && state.is_playing) ctl("/me/player/pause", "PUT");
  else if (state && state.item) resume();
  else toast("Wähle zuerst etwas zum Abspielen aus.");
}
function currentView(){ return stack.length ? stack[stack.length-1] : {type:"menu"}; }
function setTitle(t){
  currentView().title = t;
  $("#title").textContent = t;
  const back = $("#back");
  back.style.display = stack.length ? "" : "none";
  back.textContent = "‹ " + (stack.length > 1 ? (stack[stack.length-2].title || "Zurück") : "Menü");
}
function push(view){ stack.push(view); render("fwd"); }
function goBack(){ stack.pop(); render("bwd"); }
function goMenu(){ stack = []; render("bwd"); }
function render(dir){
  const main = $("#main"); main.innerHTML = ""; main.scrollTop = 0;
  const page = h("div", {class:"page" + (dir ? " " + dir : "")}); main.append(page);
  const view = currentView();
  VIEWS[view.type](page, view).catch(e => { page.append(h("div", {class:"msg"}, "Konnte nicht laden: " + e.message)); });
  setTimeout(renderPlayer, 0);
}
// Zeile: o.nav = führt tiefer (Pfeil), o.uri = Song (blauer Punkt, wenn er läuft)
function row(o){
  return h("button", {class:"row", "data-uri": o.uri, onclick: o.onclick, id: o.id},
    o.uri ? h("span", {class:"dot"}) : null,
    o.num != null ? h("span", {class:"num"}, o.num) : null,
    h("div", {class:"t"}, h("b", null, o.title), o.sub ? h("span", null, o.sub) : null),
    o.nav ? h("span", {class:"chev"}, "›") : null);
}
function head(title, info, uri){
  return h("div", {class:"head"}, h("h2", null, title), info ? h("p", null, info) : null,
    h("div", {class:"actions"},
      h("button", {class:"btn", onclick: () => playCtx(uri)}, "Abspielen"),
      h("button", {class:"btn sec", onclick: () => shufflePlay(uri)}, "Zufall")));
}
function loading(main){ const m = h("div", {class:"msg"}, "Lädt …"); main.append(m); return m; }
async function pager(main, firstUrl, query, mapItem, onPage){
  let next = firstUrl, q = query, list = h("div"); main.append(list);
  const btn = row({title:"Mehr laden"}); btn.style.display = "none"; btn.style.color = "var(--blue)";
  main.append(btn);
  let errMsg = null;
  async function load(){
    btn.style.display = "none";
    if (errMsg) { errMsg.remove(); errMsg = null; }
    const l = h("div", {class:"msg"}, "Lädt …"); list.after(l);
    let d;
    try { d = await api(next, {query:q}); } finally { l.remove(); }
    q = null;
    const items = (d.items || []).filter(Boolean);
    if (onPage) onPage(items, list);
    if (mapItem) items.forEach((it, i) => { const r = mapItem(it, i); if (r) list.append(r); });
    if (!list.children.length) list.append(h("div", {class:"msg"}, "Nichts gefunden."));
    next = d.next; if (next) btn.style.display = "";
    renderPlayer();
  }
  btn.onclick = () => load().catch(e => {
    errMsg = h("div", {class:"msg"}, "Konnte nicht laden: " + e.message);
    list.after(errMsg);
    btn.style.display = "";
  });
  await load();
}

const VIEWS = {
  async menu(main){
    setTitle("Nur Musik");
    const entries = [["Playlists","playlists"], ["Künstler","artists"], ["Alben","albums"], ["Songs","songs"], ["Suche","search"]];
    entries.forEach(([label, type]) => main.append(row({title:label, nav:true, onclick: () => push({type})})));
    main.append(row({title:"Läuft", nav:true, id:"menuNow", onclick: openFull}));
    main.append(row({title:"Einstellungen", nav:true, onclick: () => push({type:"settings"})}));
  },
  async playlists(main){
    setTitle("Playlists");
    main.append(row({title:"Lieblingssongs", sub:"Deine gespeicherten Songs", nav:true, onclick: () => push({type:"songs"})}));
    await pager(main, "/me/playlists", {limit:50}, p => row({
      title: p.name, sub: (p.owner && p.owner.display_name) || "", nav:true,
      onclick: () => push({type:"playlist", p})
    }));
  },
  async songs(main){
    setTitle("Lieblingssongs");
    const all = [];
    main.append(h("div", {class:"head"}, h("h2", null, "Lieblingssongs"), h("p", null, "Deine gespeicherten Songs"),
      h("div", {class:"actions"},
        h("button", {class:"btn", onclick: () => all.length && play({uris: all.slice(0,200).map(t=>t.uri)})}, "Abspielen"),
        h("button", {class:"btn sec", onclick: () => {
          if (!all.length) return;
          const u = all.map(t=>t.uri);
          for (let i = u.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [u[i],u[j]] = [u[j],u[i]]; }
          play({uris: u.slice(0,200)});
        }}, "Zufall"))));
    await pager(main, "/me/tracks", {limit:50}, null, (items, list) => {
      const startIdx = all.length;
      items.forEach(x => x.track && all.push(x.track));
      all.slice(startIdx).forEach((t, k) => {
        const idx = startIdx + k;
        list.append(row({uri:t.uri, title:t.name, sub:artists(t.artists),
          onclick: () => play({uris: all.slice(idx, idx+200).map(x=>x.uri)})}));
      });
    });
  },
  async albums(main){
    setTitle("Alben");
    await pager(main, "/me/albums", {limit:50}, x => x.album && row({
      title: x.album.name, sub: artists(x.album.artists), nav:true,
      onclick: () => push({type:"album", id:x.album.id})
    }));
  },
  async artists(main){
    setTitle("Künstler");
    const list = h("div"); main.append(list);
    const btn = row({title:"Mehr laden"}); btn.style.display = "none"; btn.style.color = "var(--blue)"; main.append(btn);
    let after = null;
    async function load(){
      btn.style.display = "none";
      const l = h("div", {class:"msg"}, "Lädt …"); list.after(l);
      const d = await api("/me/following", {query:{type:"artist", limit:50, after}}); l.remove();
      const a = d.artists || {};
      (a.items||[]).forEach(ar => list.append(row({title: ar.name, nav:true, onclick: () => push({type:"artist", ar})})));
      if (!list.children.length) list.append(h("div", {class:"msg"}, "Du folgst noch keinen Künstlern."));
      after = a.cursors && a.cursors.after; if (a.next && after) btn.style.display = "";
    }
    btn.onclick = load; await load();
  },
  async search(main){
    setTitle("Suche");
    const inp = h("input", {type:"search", placeholder:"Songs, Alben, Künstler, Playlists", enterkeyhint:"search", autocomplete:"off"});
    const res = h("div");
    main.append(h("div", {class:"search"}, inp), res);
    let timer, seq = 0;
    const last = LS.get("last_q") || "";
    inp.value = last;
    async function run(){
      const q = inp.value.trim(); LS.set("last_q", q);
      res.innerHTML = ""; if (!q) return;
      const my = ++seq; const l = loading(res);
      let d;
      try { d = await api("/search", {query:{q, type:"track,artist,album,playlist", limit:10}}); }
      catch(e){ l.remove(); res.append(h("div", {class:"msg"}, "Fehler: " + e.message)); return; }
      if (my !== seq) return; l.remove();
      const tr = ((d.tracks||{}).items||[]).filter(Boolean);
      const ar = ((d.artists||{}).items||[]).filter(Boolean);
      const al = ((d.albums||{}).items||[]).filter(Boolean);
      const pl = ((d.playlists||{}).items||[]).filter(Boolean);
      if (tr.length) { res.append(h("div", {class:"sect"}, "Songs"));
        tr.forEach(t => res.append(row({uri:t.uri, title:t.name, sub:artists(t.artists),
          onclick: () => t.album ? playCtx(t.album.uri, t.uri) : play({uris:[t.uri]})}))); }
      if (ar.length) { res.append(h("div", {class:"sect"}, "Künstler"));
        ar.slice(0,5).forEach(a => res.append(row({title:a.name, nav:true, onclick: () => push({type:"artist", ar:a})}))); }
      if (al.length) { res.append(h("div", {class:"sect"}, "Alben"));
        al.forEach(a => res.append(row({title:a.name, sub:artists(a.artists), nav:true, onclick: () => push({type:"album", id:a.id})}))); }
      if (pl.length) { res.append(h("div", {class:"sect"}, "Playlists"));
        pl.forEach(p => res.append(row({title:p.name, sub:(p.owner && p.owner.display_name)||"", nav:true, onclick: () => push({type:"playlist", p})}))); }
      if (!tr.length && !ar.length && !al.length && !pl.length) res.append(h("div", {class:"msg"}, "Nichts gefunden."));
      renderPlayer();
    }
    inp.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, 400); });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { clearTimeout(timer); inp.blur(); run(); } });
    if (last) run();
  },
  async playlist(main, {p}){
    setTitle(p.name);
    main.append(head(p.name, (p.owner && p.owner.display_name) || "", p.uri));
    // Spotify liefert Songlisten nur für eigene oder gemeinsame Playlists.
    await loadMe().catch(()=>null);
    // Ist das Profil unbekannt, versuchen wir die Songliste trotzdem.
    const mine = !me || (p.owner && p.owner.id === me.id);
    if (!mine && !p.collaborative) {
      main.append(h("div", {class:"msg"}, "Die Songliste fremder Playlists gibt Spotify nicht mehr heraus, abspielen geht aber."));
      return;
    }
    try {
      await pager(main, "/playlists/" + p.id + "/items", {limit:50}, x => {
        const t = x.item || x.track; if (!t || !t.uri) return null;
        return row({uri:t.uri, title:t.name,
          sub: t.artists ? artists(t.artists) : (t.show ? t.show.name : ""), onclick: () => playCtx(p.uri, t.uri)});
      });
    } catch(e){
      main.append(h("div", {class:"msg"}, "Songliste nicht verfügbar – abspielen geht trotzdem."));
    }
  },
  async album(main, view){
    setTitle(view.title || "Album");
    const l = loading(main);
    const a = await api("/albums/" + view.id); l.remove();
    setTitle(a.name);
    main.append(head(a.name, artists(a.artists) + (a.release_date ? " · " + a.release_date.slice(0,4) : ""), a.uri));
    await pager(main, "/albums/" + view.id + "/tracks", {limit:50}, (t) => row({
      uri:t.uri, num:t.track_number, title:t.name, sub:artists(t.artists) + " · " + fmt(t.duration_ms),
      onclick: () => playCtx(a.uri, t.uri)
    }));
  },
  async artist(main, {ar}){
    setTitle(ar.name);
    main.append(head(ar.name, "Künstler", ar.uri));
    main.append(h("div", {class:"sect"}, "Alben und Singles"));
    await pager(main, "/artists/" + ar.id + "/albums", {include_groups:"album,single", limit:10}, a => row({
      title:a.name, sub: (a.album_type === "single" ? "Single" : "Album") + (a.release_date ? " · " + a.release_date.slice(0,4) : ""), nav:true,
      onclick: () => push({type:"album", id:a.id})
    }));
  },
  async settings(main){
    setTitle("Einstellungen");
    if (me) main.append(h("div", {class:"sect"}, "Angemeldet als " + (me.display_name || me.id)));
    main.append(
      row({title:"Wiedergabegerät wählen", nav:true, onclick: devicePicker}),
      h("a", {class:"row", href:"spotify:"}, h("div", {class:"t"}, h("b", null, "Spotify-App öffnen"), h("span", null, "Falls kein Gerät gefunden wird"))),
      row({title:"Abmelden", onclick: logout}),
      row({title:"Client ID ändern", sub:"Setzt die App zurück", onclick: () => { LS.del("client_id"); logout(); }}));
  }
};

/* ============ Einrichtung ============ */
function setupScreen(errorText){
  const root = $("#root"); root.innerHTML = "";
  const inp = h("input", {placeholder:"Client ID einfügen", autocomplete:"off", autocapitalize:"off", spellcheck:"false"});
  root.append(h("div", {class:"setup"},
    h("h1", null, "Nur Musik"),
    h("p", null, "Deine Spotify-Bibliothek ohne Feed und Vorschläge. Einmalige Einrichtung:"),
    errorText ? h("p", {class:"err"}, errorText) : null,
    h("ol", null,
      h("li", null, "Öffne developer.spotify.com/dashboard und melde dich mit deinem Spotify-Konto an (Premium nötig)."),
      h("li", null, "„Create app“: beliebiger Name, bei „Which API/SDKs“ Web API anhaken."),
      h("li", null, "Als Redirect URI genau diese Adresse eintragen:", h("br"), h("code", null, REDIRECT)),
      h("li", null, "Speichern, dann die Client ID kopieren und hier einfügen.")),
    inp,
    h("button", {class:"btn", onclick: () => {
      const v = inp.value.trim();
      if (!/^[0-9a-f]{32}$/i.test(v)) { toast("Das sieht nicht wie eine Client ID aus (32 Zeichen)."); return; }
      LS.set("client_id", v); login();
    }}, "Weiter zur Anmeldung")));
}
function loginScreen(errorText){
  const root = $("#root"); root.innerHTML = "";
  root.append(h("div", {class:"setup"},
    h("h1", null, "Nur Musik"),
    errorText ? h("p", {class:"err"}, errorText) : h("p", null, "Melde dich mit Spotify an."),
    h("button", {class:"btn", onclick: login}, "Mit Spotify anmelden"),
    h("p", {style:"margin-top:30px"}, h("a", {href:"#", class:"link", onclick: e => { e.preventDefault(); LS.del("client_id"); setupScreen(); }}, "Client ID ändern"))));
}

/* ============ Start ============ */
async function start(){
  LS.del("device"); // alter, automatisch gemerkter Lautsprecher
  LS.del("tab");    // Start ist jetzt immer das Menü
  const params = new URLSearchParams(location.search);
  if (params.get("error")) {
    history.replaceState(null, "", REDIRECT);
    return LS.get("client_id") ? loginScreen("Anmeldung abgebrochen: " + params.get("error")) : setupScreen();
  }
  if (!LS.get("client_id")) return setupScreen();
  if (params.get("code")) {
    try {
      await tokenRequest({grant_type:"authorization_code", code:params.get("code"), redirect_uri:REDIRECT, code_verifier:LS.get("pkce_verifier")});
    } catch(e) {
      history.replaceState(null, "", REDIRECT);
      return loginScreen("Anmeldung fehlgeschlagen: " + e.message + ". Stimmt die Redirect URI im Spotify-Dashboard?");
    }
    history.replaceState(null, "", REDIRECT);
  }
  if (!LS.get("refresh_token")) return loginScreen();
  shell();
  try { await loadMe(); }
  catch(e) {
    if (e.status === 403) return loginScreen("Spotify verweigert den Zugriff. Ist dein Konto im Dashboard unter „User Management“ eingetragen und hast du Premium?");
    toast("Profil konnte nicht geladen werden: " + esc(e.message));
  }
  render();
  pollPlayer();
  pollTimer = setInterval(() => { if (!document.hidden) pollPlayer(); }, 4000);
  setInterval(tick, 500);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pollPlayer(); });
}
start();
</script>
